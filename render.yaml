# OPTIONAL fallback host. The primary deploy runs entirely on Vercel — frontend
# plus the API as a Python function — see vercel.json and DEPLOY.md.
#
# This config is here in case you want the API somewhere that is not serverless
# (no cold starts mid-game, no 60s function ceiling). It uses Render's FREE
# plan, which means NO persistent disk: the filesystem is wiped on every restart
# and the service sleeps after 15 minutes idle. That is survivable because the
# save no longer lives on the container — GM2000_STORE keeps it in durable
# storage and backend/store.py pulls it down at boot. See DEPLOY.md.
#
# The earlier version of this file asked for a paid `starter` instance with a
# mounted disk. That was the only way to keep a save before store.py existed.
services:
  - type: web
    name: wwe-gm-2000-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Free instances have no disk; /tmp is the writable scratch space and the
      # store is what actually makes the save durable.
      - key: GM2000_DATA_DIR
        value: /tmp/gm2000
      - key: GM2000_STORE
        value: blob
      # From the Vercel Blob store — Storage tab, .env snippet.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      # Your Vercel URL. Not needed if the API is on Vercel too (same origin).
      - key: GM2000_CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
